name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# A superseded push has nothing left to prove; cancel its runs so the newest
# commit gets the runners. Release tags run their own workflow, unaffected.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-rehearsal:
    name: release rehearsal (no push)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # 2026-08-27
        with:
          toolchain: "1.96.0"
      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2
        with:
          tool: cargo-release@0.25.18
      # This performs a real patch bump, clean provenance rebind, annotated tag
      # creation and tag validation in an isolated local clone. It never pushes.
      # A stale-by-one release therefore fails on every PR, before a public tag
      # can be the first execution of this path.
      - name: Rehearse the complete checked release
        run: python scripts/release.py rehearse patch

  rust:
    name: fmt · clippy · test (${{ matrix.os }})
    # The kernel's claim is byte-identical determinism, so the test suite runs on
    # all three OSes: a green matrix is the cross-platform proof, not a courtesy.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      # Pin to the rust-toolchain.toml channel (1.96.0) so the wasm32 target lands on
      # the toolchain cargo actually builds with. With @stable the target is added to
      # stable, but the build uses 1.96.0 (rust-toolchain.toml) and can't find std.
      # @master is the documented way to pin an exact toolchain with this action.
      - name: Install Rust 1.96.0 (+ wasm target)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Rustdoc (deny warnings)
        if: matrix.os == 'ubuntu-latest'
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo doc --workspace --no-deps
      - name: Test
        run: cargo test --workspace
      # One wasm build is enough to prove the target compiles; keep it off the
      # slower macOS/Windows runners.
      - name: WASM target builds
        if: matrix.os == 'ubuntu-latest'
        run: cargo build -p sharpearena-wasm --target wasm32-unknown-unknown --release
      # Building wasm32 executes none of it. `cargo test` compiles the crate's JSON
      # kernels for the host, so the `#[wasm_bindgen]` export layer and the engine as
      # compiled to wasm32 never run. This step runs the committed cross-runtime
      # goldens inside a real WebAssembly module under Node, which is what makes the
      # WebAssembly leg of the byte-identity claim an enforced gate.
      - name: Install wasm-pack
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: WASM goldens execute on wasm32
        if: matrix.os == 'ubuntu-latest'
        run: wasm-pack test --node crates/sharpearena-wasm

  supply-chain:
    name: cargo-deny (licenses · advisories · bans · sources)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      # crates/sharpearena-py is `exclude`d from the workspace, so the check above
      # never sees its dependency tree (pyo3 and friends). A second action run
      # cannot cover it: the action's container has no 1.96.0 toolchain for the
      # crate's rust-toolchain override and rejects a --config argument, so run
      # the binary directly against the root policy.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      # Pinned: `check --config` moved in later cargo-deny releases; this is the
      # version the command is verified against.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.9
      - name: cargo-deny (crates/sharpearena-py, excluded from the workspace)
        working-directory: crates/sharpearena-py
        run: cargo deny check --config ../../deny.toml

  provenance:
    name: evidence provenance (tamper-evidence gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Unshallow: the manifest's `generated_at_head_dirty: false` is checked by
      # reading the recorded paths back out of the commit it names, which a
      # depth-1 checkout may not contain. A missing generation commit is a hard
      # failure, so this checkout deliberately provides the history required to
      # verify the claim instead of weakening it.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tracked text is normalized by .gitattributes
        run: |
          git add --renormalize .
          git diff --cached --exit-code
      # The manifest is what carries the recompute-from-decisions story into the
      # build. Until this job existed a manifest that had fallen behind its tree was
      # detectable only by a human who remembered to run the script by hand. What it
      # proves is a property of the commit it runs on: the tip of a pushed branch and
      # the head of a pull request, not every commit in between. This workflow runs
      # on every push to main and every pull request.
      - name: check-provenance (manifest matches the tree)
        run: python paper/src/check-provenance.py

  npm:
    name: npm (wasm wrapper)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: npm/sharpearena/package-lock.json
      - name: install · build · test (against the committed wasm pkg)
        working-directory: npm/sharpearena
        run: |
          npm ci
          npm run build
          npm test

  python:
    name: sharpearena-py (fmt, clippy, maturin, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/sharpearena-py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: crates/sharpearena-py/pyproject.toml
      # crates/sharpearena-py is `exclude`d from the workspace, so the `rust` job's
      # root `cargo fmt --all` / `cargo clippy --all-targets` never reach it: both
      # resolve against workspace members only. Run them from inside the crate dir,
      # which is the only way to lint an excluded crate.
      - name: Format
        working-directory: crates/sharpearena-py
        run: cargo fmt -- --check
      - name: Clippy (deny warnings)
        working-directory: crates/sharpearena-py
        run: cargo clippy --all-targets -- -D warnings
      - name: maturin develop + pytest (in a venv)
        working-directory: crates/sharpearena-py
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip maturin
          pip install --requirement ci-requirements.txt
          maturin develop
          python -m pytest -q

  # --- usability, not identity ------------------------------------------------------
  # Every other packaging guard here checks that the right version, commit and registry
  # are involved. Neither checks that the artifact a consumer downloads actually loads.
  # These two do, on every pull request rather than only at a tag, so a package that
  # cannot be installed is caught before it is published rather than after.

  npm-pack-install:
    name: npm pack, offline install, require
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: npm/sharpearena/package-lock.json
      - name: Pack the tarball
        working-directory: npm/sharpearena
        run: |
          set -euo pipefail
          npm ci
          npm run build
          npm pack --pack-destination "$RUNNER_TEMP"
          tarballs=("$RUNNER_TEMP"/*.tgz)
          # A pack that produced nothing, or more than one thing, fails the job rather
          # than letting the install step succeed against whatever it happens to find.
          test "${#tarballs[@]}" -eq 1
          test -s "${tarballs[0]}"
          echo "TARBALL=${tarballs[0]}" >> "$GITHUB_ENV"
      - name: Install it offline into a fresh project and require one real export
        run: |
          set -euo pipefail
          consumer="$RUNNER_TEMP/npm-consumer"
          mkdir -p "$consumer"
          cd "$consumer"
          npm init --yes > /dev/null
          # --offline against an isolated cache: if the tarball is short a file, the
          # install cannot quietly heal itself from the registry and pass anyway.
          npm install --offline --no-audit --no-fund --cache "$RUNNER_TEMP/npm-cache" "$TARBALL"
          cat > smoke.cjs <<'JS'
          const arena = require("@general-liquidity/sharpearena");
          if (typeof arena.runBaseline !== "function") {
            throw new Error("runBaseline is missing from the packed tarball");
          }
          const run = arena.runBaseline({ agent: "buy_and_hold", seed: 1 });
          if (!Array.isArray(run.returns) || run.returns.length === 0) {
            throw new Error("runBaseline returned no series from the packed wasm");
          }
          console.log("required the tarball and ran " + run.returns.length + " bars");
          JS
          node smoke.cjs

  wheel-install-import:
    name: maturin build, pip install the wheel, import
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/sharpearena-py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel
        working-directory: crates/sharpearena-py
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip maturin
          maturin build --out "$RUNNER_TEMP/dist"
          wheels=("$RUNNER_TEMP"/dist/*.whl)
          test "${#wheels[@]}" -eq 1
          test -s "${wheels[0]}"
          echo "WHEEL=${wheels[0]}" >> "$GITHUB_ENV"
      - name: Install it into a fresh venv and step one bar
        # Run from outside the checkout so the import resolves to the installed wheel
        # and not to the source tree, and install only the wheel's declared
        # dependencies: the pytest job installs the full ci-requirements set, which
        # would hide a missing runtime dependency.
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          python -m venv consumer
          ./consumer/bin/pip install --quiet "$WHEEL"
          cat > smoke.py <<'PY'
          from importlib.resources import files

          import sharpearena

          env = sharpearena.TradingEnv()
          env.reset()
          observation, reward, done, info = env.step('{"orders": []}')
          assert isinstance(reward, float), reward
          assert not done
          assert files("sharpearena").joinpath("py.typed").is_file(), "py.typed did not ship"
          print("imported the wheel and stepped one bar")
          PY
          ./consumer/bin/python smoke.py

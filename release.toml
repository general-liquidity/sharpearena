# SharpeArena release pipeline (cargo-release).
#
# Always run the green checks first (cargo-release will not):
#   cargo test --workspace && cargo clippy --workspace --all-targets && cargo deny check
#
# Then rehearse and cut the release through the checked driver:
#   python scripts/release.py rehearse patch
#   python scripts/release.py execute patch
#
# Publishing is done by CI via OIDC Trusted Publishing on the `v*` tag (see
# RELEASING.md), NOT from the local machine — so `publish = false` here. This is not just
# a preference: these crates are Trusted-Publishing-only on crates.io, so a token upload
# from a laptop is refused with a 403 ("New versions of this crate can only be published
# using Trusted Publishing") part-way through the workspace, leaving a half-published
# release behind. The `v*` tag is the only publish path.
#
# The three registry manifests that are NOT Cargo-workspace-inherited (npm/sharpearena,
# and crates/sharpearena-py, which is excluded from the workspace) are rewritten from the
# workspace version by `pre-release-replacements`. Those rules live in
# crates/sharpearena/release.toml, because cargo-release resolves `file` relative to each
# crate rather than to the workspace root - a workspace-level rule aborts.

shared-version = true
consolidate-commits = true
dependent-version = "upgrade"
tag-name = "v{{version}}"
tag-message = "SharpeArena v{{version}}"
pre-release-commit-message = "release: v{{version}}"

publish = false # CI publishes via OIDC; never publish from a dev machine
push = false # scripts/release.py atomically pushes main + the verified tag
allow-branch = ["main"]

# The checked driver applies the tag one commit after cargo-release's version bump.
# It regenerates provenance only after the bump commit is clean, commits only the
# manifest, validates that exact prospective tag, and atomically pushes branch + tag.
# Keeping both cargo-release's tag and push disabled makes invoking cargo-release
# directly incapable of publishing an unchecked tag.
tag = false

# SharpeArena release pipeline (cargo-release).
#
# Always run the green checks first (cargo-release will not):
#   cargo test --workspace && cargo clippy --workspace --all-targets && cargo deny check
#
# Then cut a release — bump the shared version, rewrite inter-crate pins, tag, push:
#   cargo release patch              # DRY RUN — prints what would happen
#   cargo release patch --execute    # bump + tag + push  (publishing happens in CI)
#
# Publishing is done by CI via OIDC Trusted Publishing on the `v*` tag (see
# RELEASING.md), NOT from the local machine — so `publish = false` here. This is not just
# a preference: these crates are Trusted-Publishing-only on crates.io, so a token upload
# from a laptop is refused with a 403 ("New versions of this crate can only be published
# using Trusted Publishing") part-way through the workspace, leaving a half-published
# release behind. The `v*` tag is the only publish path.
#
# The three registry manifests that are NOT Cargo-workspace-inherited (npm/sharpearena,
# and crates/sharpearena-py, which is excluded from the workspace) are rewritten from the
# workspace version by `pre-release-replacements`. Those rules live in
# crates/sharpearena/release.toml, because cargo-release resolves `file` relative to each
# crate rather than to the workspace root - a workspace-level rule aborts.

shared-version = true
consolidate-commits = true
dependent-version = "upgrade"
tag-name = "v{{version}}"
tag-message = "SharpeArena v{{version}}"
pre-release-commit-message = "release: v{{version}}"

publish = false # CI publishes via OIDC; never publish from a dev machine
push = true
allow-branch = ["main"]

# The tag is applied by hand, one commit later. See the hook note below: the manifest
# that ships inside the release commit is generated while the version bump is still
# uncommitted, so it records `generated_at_head_dirty: true` and cannot claim to
# describe any commit. Rebinding on the committed release tree produces a manifest
# that names it and is checked against it, and the tag belongs on that commit rather
# than on the one whose manifest can only assert its digests. RELEASING.md carries the
# two commands.
tag = false

# The version bump rewrites Cargo.toml, Cargo.lock, both sharpearena-py
# manifests, __init__.py and the wasm crate manifest, and all six are inside the
# provenance source scope. Binding the manifest before the release therefore
# leaves it stale the moment cargo-release commits, and the tamper-evidence job
# fails on the release commit and on every commit after it. This hook runs after
# the version bump and the replacements and before the commit, so the release
# commit's manifest binds the release commit's tree.
#
# The hook necessarily runs while the bump is uncommitted, so what it writes is
# honestly marked `generated_at_head_dirty: true`: its digests are right and its
# generation head names a commit whose tree they do not describe. That is why the
# tag goes on the rebind commit instead, and why the hook is not the whole fix.
# cargo-release runs the hook from the crate directory, not the workspace root,
# so the path is resolved from the repository root git reports.
pre-release-hook = [
  "bash",
  "-c",
  "python \"$(git rev-parse --show-toplevel)/paper/src/make-provenance.py\"",
]

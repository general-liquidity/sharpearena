# cargo-deny: supply-chain gate for SharpeArena.
#
# An environment's credibility rests on reproducible, auditable builds, so the
# dependency surface is kept deliberately tiny (serde, sha2, hmac, wasm-bindgen
# and their transitive deps) and gated here. Run locally with `cargo deny check`;
# CI runs it on every push (see .github/workflows/ci.yml).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# No ignored advisories: CI fails on any new RustSec advisory in the tree. Add an
# entry here only with a reason and a removal condition.
ignore = []

[licenses]
version = 2
# Every license SPDX expression present in the current dependency tree (derived
# from `cargo metadata`). Keep this tight; a new dep with a different license
# should fail CI and force a conscious decision.
allow = [
    "MIT",
    "Apache-2.0",
    # target-lexicon (pyo3 build dep, sharpearena-py tree): the LLVM exception
    # only relaxes Apache-2.0's binary-attribution clause; no new obligations.
    # The workspace leg reports this entry as an unmatched allowance, because the
    # crate that carries it is in the excluded Python crate's tree and not the
    # workspace's. That warning is expected; the entry is load-bearing for
    # `cargo deny check --config ../../deny.toml` run from crates/sharpearena-py.
    "Apache-2.0 WITH LLVM-exception",
    # BSD-3-Clause was removed on 2026-09-15. `subtle` was the only crate that
    # carried it, and curve25519-dalek 5, which the SharpeBench 0.27.0 pin brings
    # in, replaced it. cargo-deny reported the stale entry as an unmatched
    # allowance on both legs; leaving it would have admitted a future BSD-3-Clause
    # dependency without the conscious decision this list exists to force.
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.9

[bans]
# Duplicate versions are a warning (common and usually harmless transitively);
# wildcard version requirements are denied: the environment must pin what it builds.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

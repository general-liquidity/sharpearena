[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "sharpearena"
version = "0.31.0"
description = "SharpeArena: a deterministic point-in-time evaluation sandbox and Gymnasium environment for trading agents."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "General Liquidity, Inc." }]
keywords = ["trading", "agent", "environment", "backtest", "reinforcement-learning", "gymnasium"]
# PrimeIntellect Environments-Hub discoverability tags (read from [project].tags by the
# `prime` CLI at push time; ignored by maturin's PEP 621 parser, so the wheel is unaffected).
tags = ["train", "eval", "trading", "agent", "rl", "verifiers", "multi-turn", "leak-free"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.21",
    "gymnasium>=1.0",
]

[project.scripts]
sharpearena-local-field = "sharpearena.local_field_cli:main"
sharpearena-prospective-field = "sharpearena.prospective_field:main"
sharpearena-ollama-shim = "sharpearena.ollama_shim:main"
sharpearena-openai-shim = "sharpearena.openai_compatible_shim:main"
sharpearena-compile-bench = "sharpearena.bench_bridge:main"
sharpearena-strategy-search = "sharpearena.strategy_cli:main"
sharpearena-paper = "sharpearena.paper_cli:main"

[project.optional-dependencies]
# Bounded to the range CI installs and exercises. Unbounded, `pip install
# "sharpearena[verifiers]"` resolved to whatever was newest, which is not the API this
# adapter is tested against: the module docstring and `docs/interfaces.md` record
# verification at 0.1.14, `ci-requirements.txt` pins 0.3.1, and the source suite plus the
# installed-wheel extras matrix both run against 0.3.1. Which version the adapter should
# target is INT-10's question; this bound only stops the declared extra resolving to one
# nothing here has run.
verifiers = ["verifiers>=0.3.1,<0.4"]
# minari keeps h5py behind its own `hdf5` extra and jax behind `create`, and its HDF5
# storage imports PIL without declaring pillow at all, so a bare `minari` reproduces
# the environment CI had while every Minari test silently skipped.
minari = ["minari[create,hdf5]", "pillow"]
pettingzoo = ["pettingzoo"]
# Bounded below 2.0, verified against the INT-18 installed-wheel matrix: an unbounded
# `mcp = ["mcp"]` resolved to 2.2.0, whose `mcp.server.fastmcp` import shape changed
# enough that `mcp_server.py`'s own guard could not import `FastMCP`, was caught by its
# broad `except Exception`, and reported "mcp is not installed" while mcp was installed.
# 1.30.0, the version `ci-requirements.txt` pins and the source suite runs against,
# imports cleanly; this bound is what stops the declared extra resolving to a release
# nothing here has run against.
mcp = ["mcp>=1.30.0,<2.0"]

# Defaults for `vf-eval sharpearena` (read by verifiers' eval script from this table).
# A bare `vf-eval sharpearena` then scores 16 scenarios x 3 rollouts of the v1 taskset.
[tool.verifiers.eval]
num_examples = 16
rollouts_per_example = 3

[tool.maturin]
# Mixed Rust/Python layout: the pure-Python package lives under `python/sharpearena`,
# and the compiled pyo3 extension is placed inside it as `sharpearena.sharpearena_py`.
module-name = "sharpearena.sharpearena_py"
python-source = "python"
manifest-path = "Cargo.toml"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
# Do not recursively collect copied test modules left by `cargo package` under
# target/package. A used checkout must exercise the same canonical suite as a
# clean CI checkout instead of importing two files with each test-module name.
testpaths = ["tests"]

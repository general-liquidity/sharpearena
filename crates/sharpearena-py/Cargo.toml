# Standalone (not a workspace member): a pyo3 extension-module needs a Python
# interpreter at build time, so it is built by maturin rather than `cargo --workspace`.
# Concrete fields (no `.workspace` inheritance) since it sits outside the workspace.
[package]
name = "sharpearena-py"
version = "0.24.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Python bindings for SharpeArena's deterministic point-in-time trading-agent evaluation sandbox and RL environment."
repository = "https://github.com/general-liquidity/sharpearena"

[lib]
name = "sharpearena_py"
crate-type = ["cdylib"]

[dependencies]
sharpearena = { path = "../sharpearena", version = "0.24.1" }
sharpebench-core = "=0.21.0"
serde_json = { version = "1", features = ["float_roundtrip"] }

[dependencies.pyo3]
version = "0.29"
features = ["extension-module"]

# Empty workspace table: this crate is built standalone by maturin, and the table
# stops Cargo from attaching it to an enclosing workspace (for example a checkout
# nested inside another repository).
[workspace]
